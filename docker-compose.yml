version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: teammind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: teammind_db
      POSTGRES_USER: teammind_user
      POSTGRES_PASSWORD: teammind_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teammind_user -d teammind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: teammind_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teammind_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "1"
      DATABASE_URL: postgres://teammind_user:teammind_secret_password@db:5432/teammind_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: django-insecure-teammind-dev-key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teammind_celery
    restart: unless-stopped
    command: celery -A teammind worker -l info
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgres://teammind_user:teammind_secret_password@db:5432/teammind_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: django-insecure-teammind-dev-key
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teammind_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_GRAPHQL_URL: http://localhost:8000/graphql

  nginx:
    image: nginx:1.25-alpine
    container_name: teammind_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
